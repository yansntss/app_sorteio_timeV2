<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos — Alto Valor FC</title>
  <style>
    :root {
      --bg:         #07090a;
      --surface:    #0e1214;
      --card:       #141a1d;
      --card2:      #1a2228;
      --border:     #243038;
      --green:      #39e073;
      --green-dim:  #27a350;
      --green-glow: rgba(57,224,115,.25);
      --gold:       #f5c842;
      --red:        #f06060;
      --text:       #d8eae0;
      --text-dim:   #4d6655;
      --radius:     14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      padding-bottom: 100px;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(57,224,115,.018) 60px, rgba(57,224,115,.018) 61px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(57,224,115,.018) 60px, rgba(57,224,115,.018) 61px);
    }

    header { text-align: center; padding: 36px 20px 8px; }
    .logo-ball { font-size: 2rem; display: block; margin-bottom: 4px; }
    header h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #39e073 30%, #9fefbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--text-dim);
      font-size: .72rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      max-width: 520px;
      margin: 0 auto 8px;
      padding: 0 16px;
      font-size: .78rem;
      color: var(--text-dim);
    }
    .user-bar.hidden { display: none !important; }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--border);
      background: var(--card2);
    }
    .user-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-bar a, .btn-logout {
      color: var(--text-dim);
      font-size: .72rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      white-space: nowrap;
      cursor: pointer;
      background: transparent;
      font-family: inherit;
    }
    .user-bar a:hover, .btn-logout:hover { color: var(--red); border-color: var(--red); }

    .container { max-width: 520px; margin: 0 auto; padding: 0 16px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-family: Impact, 'Arial Black', sans-serif;
      color: var(--green);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-size: 1.05rem;
    }

    .btn {
      padding: 13px 16px; border: 0; border-radius: 11px;
      font-weight: 700; font-size: .92rem; cursor: pointer;
      transition: all .15s; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      color: #062;
    }
    .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 0 22px var(--green-glow); transform: translateY(-1px); }

    .loading {
      text-align: center; padding: 36px 0; color: var(--text-dim);
      font-size: .85rem; letter-spacing: 3px; text-transform: uppercase;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      text-decoration: none;
      display: block;
      color: inherit;
    }
    .game-card:hover { border-color: var(--green); transform: translateY(-1px); }

    .game-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .game-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      flex: 1;
    }
    .badge {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-open     { background: rgba(57,224,115,.12); color: var(--green); border: 1px solid rgba(57,224,115,.3); }
    .badge-closed   { background: rgba(245,200,66,.12); color: var(--gold);  border: 1px solid rgba(245,200,66,.3); }
    .badge-sorted   { background: rgba(91,164,245,.12); color: #5ba4f5;      border: 1px solid rgba(91,164,245,.3); }
    .badge-finished { background: rgba(77,102,85,.12);  color: var(--text-dim); border: 1px solid var(--border); }

    .game-meta {
      font-size: .78rem;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .game-meta span { display: flex; align-items: center; gap: 3px; }

    .progress-bar-wrap {
      background: var(--card2);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--green);
      transition: width .3s;
    }
    .progress-bar-fill.full { background: var(--red); }
    .progress-label {
      font-size: .72rem;
      color: var(--text-dim);
      margin-top: 5px;
    }
    .progress-label .count { color: var(--green); font-weight: 700; }
    .progress-label .count.full { color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-dim);
    }
    .empty-state p { font-size: .88rem; margin-bottom: 20px; }

    /* Floating add button */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 24px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      color: #062;
      font-size: 1.6rem;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--green-glow);
      transition: transform .15s, filter .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 1;
    }
    .fab:hover { transform: scale(1.1); filter: brightness(1.15); }
    .fab.hidden { display: none !important; }

    .hidden { display: none !important; }

    @media (max-width: 460px) {
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo-ball">⚽</span>
  <h1>Alto Valor FC</h1>
  <p>Agenda de Jogos</p>
</header>

<div class="user-bar hidden" id="userBar">
  <img class="user-avatar" id="userAvatar" src="" alt="">
  <span class="user-name" id="userName"></span>
  <a href="/sortear.html" style="text-decoration:none" class="btn-logout hidden" id="navSorteio">Sorteio</a>
  <a href="/campeonato.html" style="text-decoration:none" class="btn-logout">🏆 Campeonato</a>
  <a href="/jogadores.html" style="text-decoration:none" class="btn-logout">Jogadores</a>
  <a href="/api/auth/logout" class="btn-logout">Sair</a>
</div>

<div class="container">
  <div id="root">
    <div class="panel"><div class="loading">carregando...</div></div>
  </div>
</div>

<a href="/criar-jogo.html" class="fab hidden" id="fabAdd" title="Criar jogo">+</a>

<script>
'use strict';

let currentUser = null;
let games = [];

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dateStr) {
  // dateStr is YYYY-MM-DD
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];
  const dayName = days[dt.getDay()];
  return `${dayName}, ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`;
}

function statusLabel(status) {
  if (status === 'open')     return ['Aberto',    'badge-open'];
  if (status === 'closed')   return ['Fechado',   'badge-closed'];
  if (status === 'sorted')   return ['Sorteado',  'badge-sorted'];
  if (status === 'finished') return ['Encerrado', 'badge-finished'];
  return [status, 'badge-finished'];
}

function renderGames() {
  const root = document.getElementById('root');
  if (!games.length) {
    root.innerHTML = `
      <div class="panel">
        <div class="empty-state">
          <p>Nenhum jogo agendado ainda.</p>
          ${currentUser && currentUser.is_admin
            ? '<a href="/criar-jogo.html" class="btn btn-primary" style="text-decoration:none;display:inline-block">+ Criar primeiro jogo</a>'
            : ''}
        </div>
      </div>`;
    return;
  }

  let html = '';
  for (const g of games) {
    const count = g.confirmed_count || 0;
    const max = g.max_players || 24;
    const pct = Math.min(100, Math.round(count / max * 100));
    const isFull = count >= max;
    const [label, cls] = statusLabel(g.status);

    html += `
    <a class="game-card" href="/jogo.html?id=${esc(g.id)}">
      <div class="game-card-top">
        <span class="game-title">${esc(g.title)}</span>
        <span class="badge ${cls}">${label}</span>
      </div>
      <div class="game-meta">
        <span>📅 ${esc(formatDate(g.game_date))}</span>
        <span>⏰ ${esc(g.game_time)}</span>
        ${g.location ? `<span>📍 ${esc(g.location)}</span>` : ''}
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill${isFull ? ' full' : ''}" style="width:${pct}%"></div>
      </div>
      <div class="progress-label">
        <span class="count${isFull ? ' full' : ''}">${count}</span>/${max} vagas
      </div>
    </a>`;
  }
  root.innerHTML = html;
}

function renderUserBar(user) {
  const bar    = document.getElementById('userBar');
  const avatar = document.getElementById('userAvatar');
  const name   = document.getElementById('userName');
  if (user) {
    avatar.src = user.picture || '';
    avatar.style.display = user.picture ? '' : 'none';
    name.textContent = user.name || user.email || '';
    bar.classList.remove('hidden');
  }
}

async function boot() {
  // 1. Check auth
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    currentUser = data.user;
  } catch {
    currentUser = null;
  }

  if (!currentUser) {
    // Redirect to login
    location.href = '/api/auth/login?redirect=' + encodeURIComponent(location.href);
    return;
  }

  renderUserBar(currentUser);

  if (currentUser.is_admin) {
    document.getElementById('fabAdd').classList.remove('hidden');
    document.getElementById('navSorteio').classList.remove('hidden');
  }

  // 2. Load games
  try {
    const res = await fetch('/api/games');
    const data = await res.json();
    games = data.games || [];
  } catch {
    games = [];
  }

  renderGames();
}

boot();
</script>
</body>
</html>
