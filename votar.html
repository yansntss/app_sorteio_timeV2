<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗳️ Votação — Alto Valor FC</title>
  <style>
    :root {
      --bg:         #07090a;
      --surface:    #0e1214;
      --card:       #141a1d;
      --card2:      #1a2228;
      --border:     #243038;
      --green:      #39e073;
      --green-dim:  #27a350;
      --green-glow: rgba(57,224,115,.25);
      --gold:       #f5c842;
      --red:        #f06060;
      --text:       #d8eae0;
      --text-dim:   #4d6655;
      --radius:     14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(57,224,115,.018) 60px, rgba(57,224,115,.018) 61px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(57,224,115,.018) 60px, rgba(57,224,115,.018) 61px);
    }

    header { text-align: center; padding: 36px 20px 8px; }
    .logo-ball { font-size: 2rem; display: block; margin-bottom: 4px; }
    header h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #39e073 30%, #9fefbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--text-dim);
      font-size: .72rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── USER BAR ──────────────────────────────────────────────────────── */
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      max-width: 520px;
      margin: 0 auto 8px;
      padding: 0 16px;
      font-size: .78rem;
      color: var(--text-dim);
    }
    .user-bar.hidden { display: none !important; }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--border);
      background: var(--card2);
    }
    .user-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-bar a {
      color: var(--text-dim);
      font-size: .72rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .user-bar a:hover { color: var(--red); border-color: var(--red); }

    .container { max-width: 520px; margin: 0 auto; padding: 0 16px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-family: Impact, 'Arial Black', sans-serif;
      color: var(--green);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-size: 1.05rem;
    }

    .btn {
      padding: 13px 16px; border: 0; border-radius: 11px;
      font-weight: 700; font-size: .92rem; cursor: pointer;
      transition: all .15s; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      color: #062;
    }
    .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 0 22px var(--green-glow); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--green); border-color: var(--green); }

    .vote-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .vote-name {
      font-size: .98rem; font-weight: 700;
    }
    .stars {
      display: flex; gap: 6px; justify-content: space-between;
    }
    .star {
      cursor: pointer; font-size: 1.95rem;
      opacity: .2; user-select: none; line-height: 1;
      transition: transform .12s, opacity .12s;
      flex: 1; text-align: center;
    }
    .star:hover { transform: scale(1.18); }
    .star.on { opacity: 1; color: var(--gold); filter: drop-shadow(0 0 6px rgba(245,200,66,.4)); }

    .progress {
      font-size: .78rem; color: var(--text-dim);
      text-align: center; margin: 10px 0 14px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .progress b { color: var(--green); }

    .vmsg {
      padding: 11px 13px; border-radius: 9px;
      border: 1px solid var(--border); font-size: .85rem;
      margin-bottom: 10px;
    }
    .vmsg.err  { background: rgba(240,96,96,.09);  border-color: var(--red);   color: var(--red);   }
    .vmsg.ok   { background: rgba(57,224,115,.07); border-color: var(--green); color: var(--green); }

    .loading {
      text-align: center; padding: 36px 0; color: var(--text-dim);
      font-size: .85rem; letter-spacing: 3px; text-transform: uppercase;
    }

    .rank-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .rank-pos {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .92rem; flex-shrink: 0;
    }
    .rank-item.gold .rank-pos   { background: rgba(245,200,66,.15); border-color: var(--gold); color: var(--gold); }
    .rank-item.silver .rank-pos { background: rgba(180,180,180,.1); border-color: #b4b4b4; color: #d8d8d8; }
    .rank-item.bronze .rank-pos { background: rgba(205,127,50,.15); border-color: #cd7f32; color: #e2a062; }
    .rank-name { flex: 1; font-size: .98rem; font-weight: 700; }
    .rank-avg  { color: var(--gold); font-weight: 700; font-size: 1.05rem; }
    .rank-total { color: var(--text-dim); font-size: .72rem; margin-left: 8px; }

    .toast {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 9px; padding: 11px 22px;
      font-size: .88rem; z-index: 700;
      transition: transform .28s ease; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .toast.on { transform: translateX(-50%) translateY(0); }

    .hidden { display: none !important; }

    @media (max-width: 460px) {
      .star { font-size: 1.7rem; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo-ball">⚽</span>
  <h1>Alto Valor FC</h1>
  <p>Votação Pós-Baba</p>
</header>

<!-- USER BAR (hidden until auth resolves) -->
<div class="user-bar hidden" id="userBar">
  <img class="user-avatar" id="userAvatar" src="" alt="">
  <span class="user-name" id="userName"></span>
  <a href="/api/auth/logout">Sair</a>
</div>

<div class="container">
  <div id="root">
    <div class="panel"><div class="loading">⏳ carregando...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const sid = new URLSearchParams(location.search).get('s');

let session     = null;   // { id, players: [{id, name}] }
let scores      = {};     // { playerId: 1..5 }
let currentUser = null;   // { id, email, name, picture }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _tt;
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m;
  el.classList.add('on');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), 2600);
}

function setRoot(html) {
  document.getElementById('root').innerHTML = html;
}

async function api(path, opts) {
  const res  = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function renderUserBar(user) {
  const bar    = document.getElementById('userBar');
  const avatar = document.getElementById('userAvatar');
  const name   = document.getElementById('userName');
  if (user && user.name) {
    avatar.src = user.picture || '';
    avatar.style.display = user.picture ? '' : 'none';
    name.textContent = user.name;
    bar.classList.remove('hidden');
  }
}

async function boot() {
  // 1. Check auth
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    currentUser = data.user;
  } catch { /* silent */ }

  if (!currentUser) {
    location.href = '/api/auth/login?redirect=' + encodeURIComponent(location.href);
    return;
  }

  renderUserBar(currentUser);

  // 2. Validate sid
  if (!sid) {
    setRoot(`<div class="panel"><div class="vmsg err">❌ Link inválido. Está faltando o parâmetro <code>?s=</code>.</div></div>`);
    return;
  }

  // 3. Load session
  try {
    session = await api(`/api/sessions/${encodeURIComponent(sid)}`);
  } catch (e) {
    setRoot(`<div class="panel"><div class="vmsg err">❌ ${esc(e.message)}</div></div>`);
    return;
  }

  renderForm();
}

function renderForm() {
  const rows = session.players.map(p => `
    <div class="vote-row" data-player="${esc(p.id)}">
      <div class="vote-name">${esc(p.name)}</div>
      <div class="stars" id="st_${p.id}">
        ${[1,2,3,4,5].map(s => `<span class="star" data-s="${s}" onclick="setStar('${esc(p.id)}',${s})">★</span>`).join('')}
      </div>
    </div>`).join('');

  setRoot(`
    <div class="panel">
      <h2>🗳️ Avalie os jogadores</h2>
      <p class="progress" id="progress">0 / ${session.players.length} avaliados</p>
      ${rows}
      <button class="btn btn-primary" style="width:100%;margin-top:14px" id="btnSubmit" onclick="submitVotes()" disabled>Enviar votos</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="showResults()">Ver ranking sem votar</button>
    </div>`);
}

function setStar(playerId, s) {
  scores[playerId] = s;
  const row = document.getElementById('st_' + playerId);
  if (row) {
    row.querySelectorAll('.star').forEach(el => {
      el.classList.toggle('on', Number(el.dataset.s) <= s);
    });
  }
  const done  = Object.keys(scores).length;
  const total = session.players.length;
  document.getElementById('progress').innerHTML = `<b>${done}</b> / ${total} avaliados`;
  document.getElementById('btnSubmit').disabled = done < total;
}

async function submitVotes() {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const votes = session.players.map(p => ({ playerId: p.id, score: scores[p.id] }));

  try {
    await api('/api/votes', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: session.id, votes }),
    });
    toast('✅ Voto registrado!');
    await showResults('Obrigado! Seu voto foi registrado.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Enviar votos';
    if (e.message && e.message.toLowerCase().includes('ja votou')) {
      toast('⚠️ Você já votou nesta sessão.');
      await showResults('Você já votou nesta sessão.');
    } else {
      toast('❌ ' + e.message);
    }
  }
}

async function showResults(headline) {
  setRoot(`<div class="panel"><div class="loading">⏳ carregando ranking...</div></div>`);
  try {
    const data = await api(`/api/results/${encodeURIComponent(sid)}`);
    renderRanking(data.ranking, headline);
  } catch (e) {
    setRoot(`<div class="panel"><div class="vmsg err">❌ ${esc(e.message)}</div></div>`);
  }
}

function renderRanking(ranking, headline) {
  const items = ranking.map((p, i) => {
    const cls   = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    return `
      <div class="rank-item ${cls}">
        <div class="rank-pos">${medal}</div>
        <div class="rank-name">${esc(p.name)}</div>
        <div class="rank-avg">${p.avg.toFixed(2)} ★</div>
        <div class="rank-total">${p.total} voto${p.total === 1 ? '' : 's'}</div>
      </div>`;
  }).join('');

  setRoot(`
    <div class="panel">
      ${headline ? `<div class="vmsg ok">✅ ${esc(headline)}</div>` : ''}
      <h2>🏆 Ranking</h2>
      ${items || '<p class="loading">Sem votos ainda.</p>'}
      <button class="btn btn-ghost" style="width:100%;margin-top:14px" onclick="location.reload()">🔄 Atualizar</button>
    </div>`);
}

boot();
</script>
</body>
</html>
